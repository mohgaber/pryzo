# Pryzo API — Render Blueprint (deploy-ready).
#
# Deploy: push this repo to GitHub, then in Render: New > Blueprint,
# pick the repo. Render creates the web service + database below.
# Full step-by-step: backend/DEPLOY.md
#
# FREE-TIER WARNINGS (do not rely on the free plan long-term):
# - The free web service sleeps after 15 minutes without traffic; the
#   first request after sleep takes ~1 minute to wake it. A cron-job.org
#   job pinging GET /health every 10 minutes keeps it awake (see
#   backend/DEPLOY.md).
# - The free PostgreSQL database EXPIRES 30 days after creation, then
#   Render deletes it (after a 14-day grace period to upgrade). Before
#   day 30, upgrade it to a paid plan (smallest is $6/month) or create
#   a new database and re-seed. The free database has no backups.

services:
  - type: web
    name: pryzo-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT is set by Render; the app must bind 0.0.0.0:$PORT.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pryzo-db
          property: connectionString
      # Generated by Render on first deploy. Copy the value from the
      # Render dashboard (service > Environment) into cron-job.org as
      # the X-Refresh-Token header. Never commit a real value here.
      - key: REFRESH_TOKEN
        generateValue: true

databases:
  - name: pryzo-db
    plan: free
